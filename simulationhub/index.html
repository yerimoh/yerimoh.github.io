<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimulationHub</title>
<meta name="description" content="에이전트가 쓸 수 있는 재료 시뮬레이션 도구와 도구 사이 관계의 레지스트리">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Code+Pro:wght@400;600&display=swap">
<style>
:root{
  --bg:#ffffff; --bg2:#f6f7f8; --fg:#1f2328; --fg2:#59636e; --bd:#d8dee4; --link:#0b57d0;
  --pre:#1d4ed8; --cmp:#c2410c; --sub:#047857; --ver:#7e22ce;
  --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; --gray:#6e7781;
  --sans:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"Source Code Pro",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0d1117; --bg2:#161b22; --fg:#e6edf3; --fg2:#9198a1; --bd:#30363d; --link:#4493f8;
  --pre:#6ea8fe; --cmp:#f0883e; --sub:#3fb950; --ver:#bc8cff;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149; --gray:#8b949e; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14.5px;line-height:1.6}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono);font-size:.92em}
h1,h2,h3{line-height:1.3;margin:0}
h1{font-size:22px}
h2{font-size:18px;margin:28px 0 10px}
h3{font-size:15px;margin:20px 0 8px}
p{margin:0 0 10px}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}

header{border-bottom:1px solid var(--bd);background:var(--bg)}
.hd{display:flex;align-items:center;gap:24px;height:56px}
.logo{font-weight:700;font-size:17px;color:var(--fg)}
.logo:hover{text-decoration:none}
.hd nav{display:flex;gap:4px;height:100%}
.hd nav a{display:flex;align-items:center;padding:0 10px;color:var(--fg2);border-bottom:2px solid transparent;margin-bottom:-1px}
.hd nav a:hover{color:var(--fg);text-decoration:none}
.hd nav a.on{color:var(--fg);border-bottom-color:var(--fg);font-weight:500}
.hd .ver{margin-left:auto;font-size:12.5px;color:var(--fg2)}

main.wrap{padding-top:28px;padding-bottom:60px}
.intro{max-width:760px;color:var(--fg2);margin-bottom:20px}
.intro p{margin:0}
.intro b{color:var(--fg);font-weight:500}

/* registry */
.reg{display:grid;grid-template-columns:210px minmax(0,1fr);gap:32px}
.side summary{display:none}
.side h4{font-size:12.5px;font-weight:700;margin:0 0 6px;color:var(--fg)}
.side fieldset{border:0;padding:0;margin:0 0 22px}
.side label{display:flex;align-items:center;gap:7px;font-size:13.5px;padding:2px 0;cursor:pointer;color:var(--fg)}
.side label .c{margin-left:auto;color:var(--fg2);font-size:12px;font-variant-numeric:tabular-nums}
.side input{margin:0}
.side button{background:none;border:0;padding:0;color:var(--link);font:inherit;font-size:12.5px;cursor:pointer}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;min-width:0;height:36px;padding:0 12px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.search input:focus{outline:2px solid var(--link);outline-offset:-1px;border-color:transparent}
.search select{height:36px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;padding:0 8px}
.rescount{font-size:13px;color:var(--fg2);margin-bottom:6px}
.list{border-top:1px solid var(--bd)}
.item{padding:13px 0;border-bottom:1px solid var(--bd);display:grid;gap:3px}
.item .t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.item .n{font-weight:700;font-size:15px}
.item .cat{font-size:12px;color:var(--fg2)}
.item .d{color:var(--fg)}
.item .m{font-size:12.5px;color:var(--fg2);display:flex;flex-wrap:wrap;gap:4px 16px}
.item .m .warn{color:var(--bad)}
.dot{display:inline-flex;align-items:center;gap:5px}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-prod{color:var(--ok)}.s-near{color:var(--sub)}.s-demo{color:var(--warn)}.s-dead{color:var(--gray)}.s-comm{color:var(--pre)}.s-res{color:var(--ver)}.s-gap{color:var(--cmp)}
.hubtag{font-size:12px}
.h-take{color:var(--ok)}.h-ref{color:var(--fg2)}.h-excl{color:var(--bad)}
.more{margin-top:24px;font-size:13.5px;color:var(--fg2)}
.more p{margin-bottom:6px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--bd);vertical-align:top}
th{background:var(--bg2);font-weight:500;font-size:12.5px;color:var(--fg2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--bg2)}

/* node detail */
.crumb{font-size:13px;color:var(--fg2);margin-bottom:10px}
.nd{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px}
dl.kv{display:grid;grid-template-columns:110px minmax(0,1fr);margin:0;border-top:1px solid var(--bd)}
dl.kv dt,dl.kv dd{padding:8px 0;border-bottom:1px solid var(--bd);margin:0}
dl.kv dt{color:var(--fg2);font-size:13px}
.side-box{border:1px solid var(--bd);border-radius:6px;padding:14px 16px;font-size:13.5px;align-self:start}
.side-box ul{margin:6px 0 0;padding-left:18px}
.rt{font-size:12px;font-weight:500}
.rt-pre{color:var(--pre)}.rt-cmp{color:var(--cmp)}.rt-sub{color:var(--sub)}.rt-ver{color:var(--ver)}

/* graph */
.gwrap{border:1px solid var(--bd);border-radius:6px;overflow-x:auto;background:var(--bg)}
#graph{display:block;min-width:900px;width:100%;height:auto}
#graph text{font-family:var(--sans)}
#graph .node rect{fill:var(--bg);stroke:var(--bd);stroke-width:1}
#graph .node:hover rect{stroke:var(--fg2)}
#graph .node.sel rect{stroke:var(--fg);stroke-width:1.6}
#graph .node .nm{font-size:12.5px;font-weight:500;fill:var(--fg)}
#graph .node .tr{font-size:11px;fill:var(--fg2)}
#graph .node{cursor:pointer}
#graph .colh{font-size:12px;fill:var(--fg2)}
#graph .fade{opacity:.13}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;margin:10px 0 0;color:var(--fg2)}
.legend label{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--fg)}
.gnote{font-size:13px;color:var(--fg2);margin-top:6px}

.seg{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 12px}
.seg button{border:0;background:var(--bg);color:var(--fg);font:inherit;font-size:13px;padding:6px 12px;cursor:pointer;border-right:1px solid var(--bd)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--bg2);font-weight:500}
ol.steps{margin:0;padding-left:22px}
ol.steps li{padding:4px 0}
ol.steps .why{color:var(--fg2);font-size:13px}
ol.steps .k{font-size:12px;margin-left:6px}
ol.steps li.blocked > span:first-child{text-decoration:line-through;color:var(--fg2)}
.k-ok{color:var(--ok)}.k-silent{color:var(--warn)}.k-blocked{color:var(--bad)}.k-added{color:var(--pre)}
.res{margin-top:10px;font-size:13.5px}

.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
.prose{max-width:760px}
.prose p{margin-bottom:12px}
.plain{margin:0;padding-left:20px}
.plain li{margin:3px 0}
footer{border-top:1px solid var(--bd);padding:20px 0 40px;font-size:12.5px;color:var(--fg2)}

@media (max-width:860px){
  .reg,.nd,.cols2{grid-template-columns:1fr}
  .side[open]{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
  .hd{gap:12px;height:auto;padding:10px 0;flex-wrap:wrap}
  .hd nav{height:auto;flex-wrap:wrap}
  .hd nav a{padding:4px 8px}
  .hd .ver{display:none}
}
@media (max-width:860px){.side summary{display:block;cursor:pointer;font-weight:500;padding:8px 12px;border:1px solid var(--bd);border-radius:6px;grid-column:1/-1;margin-bottom:12px}}
@media (max-width:480px){.side[open]{grid-template-columns:1fr}}
</style>
</head>

var stOrder={prod:0,near:1,comm:2,res:3,demo:4,dead:5,gap:6};
function regList(){
  var q=F.q.trim().toLowerCase(), cats=Object.keys(F.cat).filter(function(k){return F.cat[k]}), sts=Object.keys(F.st).filter(function(k){return F.st[k]});
  var rows=R.filter(function(r){
    return (!cats.length||cats.indexOf(r.cat)>=0)&&(!sts.length||sts.indexOf(r.st)>=0)&&(!F.hub||r.hub===F.hub)&&
      (!F.badlic||/없음|미표기/.test(r.lic))&&(!q||[r.name,r.what,r.backend,r.url].join(" ").toLowerCase().indexOf(q)>=0)});
  if(F.sort==="name")rows=rows.slice().sort(function(a,b){return a.name.localeCompare(b.name)});
  if(F.sort==="status")rows=rows.slice().sort(function(a,b){return stOrder[a.st]-stOrder[b.st]});
  $("#rc").textContent=rows.length+"개 항목"+(rows.length<R.length?" (전체 "+R.length+"개 중)":"");
  $("#list").innerHTML=rows.map(function(r){
    var href=r.url&&/\./.test(r.url)&&!/\s/.test(r.url)?(r.url.indexOf("http")===0?r.url:"https://"+r.url):"";
    var meta=[];
    meta.push('<span class="dot s-'+r.st+'">'+ST[r.st]+'</span>');
    if(r.backend)meta.push('<span>'+esc(r.backend)+'</span>');
    if(r.lic)meta.push('<span class="'+(/없음|미표기/.test(r.lic)?"warn":"")+'">'+esc(r.lic)+'</span>');
    if(r.act)meta.push('<span>'+esc(r.act)+'</span>');
    if(r.hub)meta.push('<span class="hubtag h-'+r.hub+'">'+HUB[r.hub]+'</span>');
    return '<div class="item"><div class="t">'+(href?'<a class="n" href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(r.name)+'</a>':'<span class="n">'+esc(r.name)+'</span>')+
      '<span class="cat">'+CAT[r.cat]+(href?' · <span class="mono">'+esc(r.url)+'</span>':"")+'</span></div>'+
      '<div class="d">'+esc(r.what)+'</div><div class="m">'+meta.join("")+'</div></div>'}).join("")||
    '<p style="padding:20px 0;color:var(--fg2)">조건에 맞는 항목이 없습니다. 필터를 줄이거나 검색어를 바꿔 보세요.</p>';
}
function bindReg(){
  if(window.innerWidth<860&&!Object.keys(F.cat).some(function(k){return F.cat[k]}))$("#side").removeAttribute("open");
  $("#q").addEventListener("input",function(e){F.q=e.target.value;regList()});
  $("#sort").value=F.sort;$("#sort").addEventListener("change",function(e){F.sort=e.target.value;regList()});
  document.querySelectorAll(".side input").forEach(function(i){i.addEventListener("change",function(){
    var f=i.dataset.f; if(f==="hub")F.hub=i.value; else if(f==="badlic")F.badlic=i.checked; else F[f][i.value]=i.checked; regList()})});
  $("#reset").addEventListener("click",function(){F={q:"",cat:{},st:{},hub:"",badlic:false,sort:"default"};render()});
  regList();
}

  ["pre","ver","cmp"].forEach(function(t){var m=mk("marker",{id:"m"+t,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},defs);mk("path",{d:"M0,0L10,5L0,10z",style:"fill:var(--"+t+")"},m)});

  var eg=mk("g",{},svg);
  E.forEach(function(e){
    var a=NM[e.from],b=NM[e.to],ay=a.y+H/2,by=b.y+H/2,d;
    if(Math.abs(a.x-b.x)<10){var x=a.x+W,k=36+Math.abs(by-ay)*.18;d="M"+x+","+ay+" C"+(x+k)+","+ay+" "+(x+k)+","+by+" "+x+","+by}
    else{var x1=b.x>a.x?a.x+W:a.x,x2=b.x>a.x?b.x:b.x+W,dx=(x2-x1)/2;d="M"+x1+","+ay+" C"+(x1+dx)+","+ay+" "+(x2-dx)+","+by+" "+x2+","+by}
    var g=mk("g",{"data-t":e.type,"data-a":e.from,"data-b":e.to,class:"edge"},eg), c="var(--"+e.type+")";
    if(e.type==="sub"){mk("path",{d:d,style:"fill:none;stroke:"+c+";stroke-width:4.5"},g);mk("path",{d:d,style:"fill:none;stroke:var(--bg);stroke-width:1.6"},g)}
    else if(e.type==="cmp")mk("path",{d:d,style:"fill:none;stroke:"+c+";stroke-width:1.5;stroke-dasharray:6 4","marker-end":"url(#mcmp)","marker-start":"url(#mcmp)"},g);
    else if(e.type==="pre")mk("path",{d:d,style:"fill:none;stroke:"+c+";stroke-width:1.6","marker-end":"url(#mpre)"},g);
    else mk("path",{d:d,style:"fill:none;stroke:"+c+";stroke-width:1.5;stroke-dasharray:2 3","marker-end":"url(#mver)"},g);
    mk("title",{},g).textContent=ET[e.type]+": "+a.name+" → "+b.name+". "+e.short;
  });
  var ng=mk("g",{},svg);
  N.forEach(function(n){
    var g=mk("g",{class:"node","data-id":n.id,transform:"translate("+n.x+","+n.y+")",tabindex:"0",role:"button"},ng);
    mk("rect",{width:W,height:H,rx:4},g);
    mk("text",{x:10,y:20,class:"nm"},g).textContent=n.name;
    mk("text",{x:10,y:36,class:"tr"},g).textContent=n.tier+"  "+n.role;
    var act=function(){gsel=gsel===n.id?null:n.id;paint()};
    g.addEventListener("click",act);g.addEventListener("keydown",function(ev){if(ev.key==="Enter")act()});
  });
  $("#legend").innerHTML=Object.keys(ET).map(function(t){
    var sm={pre:'<line x1="0" y1="6" x2="22" y2="6" stroke="var(--pre)" stroke-width="1.6"/>',cmp:'<line x1="0" y1="6" x2="24" y2="6" stroke="var(--cmp)" stroke-width="1.6" stroke-dasharray="5 3"/>',sub:'<line x1="0" y1="4" x2="24" y2="4" stroke="var(--sub)" stroke-width="1.4"/><line x1="0" y1="8" x2="24" y2="8" stroke="var(--sub)" stroke-width="1.4"/>',ver:'<line x1="0" y1="6" x2="24" y2="6" stroke="var(--ver)" stroke-width="1.6" stroke-dasharray="2 3"/>'}[t];
    return '<label><input type="checkbox" data-t="'+t+'" checked><svg width="24" height="12" aria-hidden="true">'+sm+'</svg>'+ET[t]+' <span style="color:var(--fg2)">'+E.filter(function(e){return e.type===t}).length+'</span></label>'}).join("");
  document.querySelectorAll("#legend input").forEach(function(i){i.addEventListener("change",function(){on[i.dataset.t]=i.checked;paint()})});
  paint();
}
function paint(){
  var keep={};
  if(gsel){keep[gsel]=1;E.forEach(function(e){if(on[e.type]&&(e.from===gsel||e.to===gsel)){keep[e.from]=1;keep[e.to]=1}})}
  document.querySelectorAll("#graph .edge").forEach(function(g){
    g.style.display=on[g.dataset.t]?"":"none";
    g.classList.toggle("fade",!!gsel&&g.dataset.a!==gsel&&g.dataset.b!==gsel)});
  document.querySelectorAll("#graph .node").forEach(function(g){
    g.classList.toggle("sel",g.dataset.id===gsel);g.classList.toggle("fade",!!gsel&&!keep[g.dataset.id])});
}
var KL={ok:"정상",silent:"조용한 실패",blocked:"차단됨",added:"관계가 추가함"};
function drawPD(){
  $("#sc").innerHTML=SC.map(function(s,i){return '<button type="button" class="'+(i===scI?"on":"")+'" data-i="'+i+'">'+esc(s.tab)+'</button>'}).join("");
  $("#md").innerHTML=[["list","도구 목록만"],["io","입출력 형식까지"],["graph","관계까지"]].map(function(m){return '<button type="button" class="'+(m[0]===mode?"on":"")+'" data-m="'+m[0]+'">'+m[1]+'</button>'}).join("");
  var s=SC[scI],m=s[mode];
  $("#pd").innerHTML='<p><b>목표.</b> '+esc(s.goal)+'</p><ol class="steps">'+m.steps.map(function(st){
    return '<li class="'+st[2]+'"><span class="mono">'+esc(st[0])+'</span><span class="k k-'+st[2]+'">'+KL[st[2]]+'</span><br><span class="why">'+esc(st[1])+'</span></li>'}).join("")+
    '</ol><p class="res"><b class="k-'+(m.v[0]==="ok"?"ok":"silent")+'">'+(m.v[0]==="ok"?"올바른 경로.":"조용한 실패.")+'</b> '+esc(m.v[1])+'</p>';
  document.querySelectorAll("#sc button").forEach(function(b){b.addEventListener("click",function(){scI=+b.dataset.i;drawPD()})});
  document.querySelectorAll("#md button").forEach(function(b){b.addEventListener("click",function(){mode=b.dataset.m;drawPD()})});
}

/* ---------- about ---------- */
function aboutPage(){
  return '<div class="prose"><h1>소개</h1>'+
  '<p style="margin-top:12px">재료 계산 도구는 이미 충분히 많고, 그것을 에이전트에 노출한 래퍼도 수백 개가 있습니다. 비어 있는 것은 도구를 조합하는 지식입니다. LOBSTER를 쓰려면 VASP를 대칭을 끄고 밴드 수를 늘려 돌려야 한다는 것, 힘을 직접 예측하는 모델은 포논에 쓰면 안 된다는 것, Materials Project 계열과 OMat24 계열 에너지는 기준점이 달라 섞으면 안 된다는 것은 숙련된 연구자는 알지만 어디에도 기계가 읽을 수 있게 적혀 있지 않습니다. 에이전트가 이것을 모른 채 도구를 부르면 에러로 멈추지 않고 그럴듯한 틀린 숫자를 냅니다.</p>'+
  '<p>SimulationHub는 도구를 노드로, 이런 지식을 네 종류의 관계로 적고 실행 시점에 강제합니다. 관계가 적혀 있으면 에이전트가 사람 없이도 도구를 올바른 순서와 설정으로 조합할 수 있고, 그 조합을 대량으로 돌려 재료 세계의 월드모델을 학습할 데이터를 만들 수 있습니다. 이것이 MatWorld 제안의 첫 단계입니다.</p>'+
  '<h2>조사 방법</h2><p>MCP 서버와 에이전트 툴 서버, SKILL.md 스킬팩과 플러그인, MCP가 아닌 에이전트 플랫폼과 원자 단위 밖 시뮬레이터와 벤치마크와 표준의 세 갈래로 나눠 조사했습니다. GitHub 페이지, PyPI와 npm 메타데이터, arXiv와 공식 문서를 열어 확인했고 스킬팩 30여 개는 저장소를 직접 클론해 SKILL.md 수와 스크립트 수를 셌습니다. GitHub API와 일부 MCP 디렉터리 사이트는 막혀 있어 PyPI 전체 인덱스를 키워드 150개로 훑고 검색 45회로 보완했습니다. 열지 못한 항목은 [미검증]으로 표시했습니다.</p>'+
  '<h2>상태 기준</h2><ul class="plain"><li><span class="dot s-prod">prod</span> 패키징되어 있고 릴리스가 2회 이상이며 툴 목록이 실제로 있음</li><li><span class="dot s-demo">demo</span> PoC나 알파</li><li><span class="dot s-dead">dead</span> 아카이브되었거나 명백히 방치됨</li></ul>'+
  '<h2>주류 패키지의 에이전트 파일 배포</h2><p>직접 스킬을 배포하는 곳은 DeepModeling 생태계(deepmd-kit, dpdata, dpgen, dpdispatcher, reacnetgenerator), NVIDIA ALCHEMI, TB2J뿐입니다. pymatgen, LAMMPS, aiida-core, fairchem, matgl 등은 기여자용 AGENTS.md만 있고, ASE, phonopy, Quantum ESPRESSO, GPAW, atomate2, MACE, MatterGen, CP2K, PySCF 등 42개는 아무것도 없습니다.</p>'+
  '<h2>공백</h2><div class="tw"><table><thead><tr><th>분야</th><th>에이전트 래퍼</th></tr></thead><tbody>'+
  [["CFD","OpenFOAM MCP 2종, Ansys Fluent와 CFX 공식 MCP"],["FEM","FEniCSx, CalculiX, Abaqus MCP, COMSOL은 API와 스킬"],["Phase-field","MOOSE는 AutoMOOSE, MooseAgent. PRISMS-PF와 FiPy는 없음"],["kinetic Monte Carlo","Zacros, kmos, KMCLib 없음 (chatMOSP만)"],["광학","Lumerical, Tidy3D 공식. Meep은 없음"],["양자 수송","Kwant, QuantumATK 없음"],["멀티스케일","preCICE 없음"],["배터리","PyBaMM 위 Battery-Sim-Agent, MCP 없음"]].map(function(r){return '<tr><td style="white-space:nowrap">'+r[0]+'</td><td>'+r[1]+'</td></tr>'}).join("")+
  '</tbody></table></div><p class="gnote">스킬팩 쪽에서도 CALPHAD, phase-field, kMC, FEM 연속체, MOF 스크리닝, ShengBTE와 phono3py, 전기화학은 거의 비어 있습니다.</p>'+
  '<h2>허브에 반영하는 방식</h2><p>AtomisticSkills MCP 서버, fairchem-mcp의 비동기 잡 패턴, chemtoolsmcp의 실패 복구 계획, CatGo의 DAG 엔진과 HPC 제출, CrystOD, raspa-mcp, opencalphad-mcp, Profex-MCP, Pipeworx OPTIMADE 게이트웨이, MP 공식 MCP, DeepModeling과 NVIDIA의 저장소 내 스킬은 노드 실행기로 가져옵니다. materials-agent-toolkit의 JSON 카탈로그, semantikon의 타입 포트, TWA의 온톨로지에서 MCP로의 컴파일, Bohrium의 capability 스키마는 설계만 참고합니다. 라이선스가 없거나 아카이브되었거나 불완전하게 공개된 것은 제외합니다.</p>'+
  '<p>관계의 1차 자료는 스킬 본문입니다. jinzhezenggroup 62개, catgo-LRG 139개, crystal668-hub 88개, AtomisticSkills 133개 등 약 500개의 SKILL.md에 "먼저 이걸 돌려라", "이 결과는 믿지 마라"가 자연어로 적혀 있고, 여기서 전제 조건과 호환성을 반자동으로 뽑는 것이 그래프 구축의 첫 단계입니다.</p>'+
  '<h2>한계</h2><p>관계는 완전하지 않으며 완전하다고 주장하지 않습니다. VASP처럼 상용이거나 학술 전용인 도구는 그래프에 등록하되 공개 배포판에는 감싸는 코드만 넣고 실제 프로그램은 사용자가 가진 것을 가리킵니다. 이 페이지의 도구 명세 중 phonopy 외에는 원문에 완전한 명세가 없어 일반 문서 기준으로 채웠고, 확실하지 않은 칸은 카탈로그 확인으로 남겼습니다.</p></div>';
}

/* ---------- router ---------- */
function render(){
  var h=(location.hash||"#registry").slice(1), page=h.indexOf("tool-")===0?"tools":h;
  if(["registry","tools","relations","benchmarks","about"].indexOf(page)<0){page="registry";h="registry"}
  document.querySelectorAll(".hd nav a").forEach(function(a){a.classList.toggle("on",a.dataset.p===page)});
  var app=$("#app");
  if(h==="registry"){app.innerHTML=regPage();bindReg()}
  else if(h==="tools"){app.innerHTML=toolsPage();document.querySelectorAll("tr.click").forEach(function(tr){tr.addEventListener("click",function(e){if(e.target.tagName!=="A")location.hash="tool-"+tr.dataset.id})})}
  else if(h.indexOf("tool-")===0){app.innerHTML=toolPage(h.slice(5));document.querySelectorAll("[data-q]").forEach(function(a){a.addEventListener("click",function(){F.q=a.dataset.q})})}
  else if(h==="relations"){app.innerHTML=relPage();drawGraph();drawPD()}
  else if(h==="benchmarks")app.innerHTML=benchPage();
  else app.innerHTML=aboutPage();
  document.title=(page==="registry"?"":({tools:"도구",relations:"관계",benchmarks:"벤치마크",about:"소개"}[page]+" · "))+"SimulationHub";
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();
